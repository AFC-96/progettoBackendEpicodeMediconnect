# Importa il file di configurazione .env.properties o .env se non specificato estensione se presente nella root del progetto.
# Utile per sovrascrivere le impostazioni locali senza errori se il file manca.
spring.config.import=optional:file:.env[.properties]

# Assegna il nome logico all'applicazione, utile per il logging, per Spring Cloud Config o per il tracciamento interno.
spring.application.name=mediconnect-backend

# Imposta la porta su cui il server embedded (Tomcat) ascolterà le richieste HTTP.
server.port=8086

# --- Configurazione Database Postgre ---
# Specifica l'URL della connessione al database, leggendo il valore dalla variabile d'ambiente `LOCAL_DB_URL`.
spring.datasource.url=${LOCAL_DB_URL}

# Imposta il nome utente per la connessione al database, leggendo dalla variabile d'ambiente `LOCAL_DB_USERNAME`.
spring.datasource.username=${LOCAL_DB_USERNAME}

# Imposta la password per la connessione al database, leggendo dalla variabile d'ambiente `LOCAL_DB_PASSWORD`.
spring.datasource.password=${LOCAL_DB_PASSWORD}

# --- Configurazione JPA/Hibernate ---
# Istruisce Hibernate a aggiornare automaticamente lo schema del database in base alle entità Java al riavvio
# (non creare da zero né cancellare).
spring.jpa.hibernate.ddl-auto=update

# Disabilita l'apertura della sessione di persistenza per tutta la durata della richiesta HTTP.
# Migliora le performance evitando problemi di LazyInitializationException se gestiti correttamente.
spring.jpa.open-in-view=false

# Indica a Spring di eseguire sempre gli script SQL di inizializzazione (data.sql) all'avvio se presenti.
spring.sql.init.mode=always

# Ritarda l'inizializzazione del datasource finché il database non è effettivamente pronto a ricevere connessioni,
# utile in ambienti dove il DB parte dopo l'app.
spring.jpa.defer-datasource-initialization=true

# --- Configurazione JWT (JSON Web Token) ---
# Imposta la chiave segreta usata per firmare e validare i token JWT, letta dalla variabile d'ambiente `JWT_SECRET`.
jwt.secret.string=${JWT_SECRET}

# Imposta la durata di validità del token JWT (in millisecondi solitamente), letta dalla variabile d'ambiente `JWT_EXPIRATION_TIME`.
jwt.expiration.time=${JWT_EXPIRATION_TIME}

# --- Configurazione SMTP Email (Gmail) ---
# Indirizzo email mittente per l'invio di notifiche, letto dalla variabile d'ambiente `MAIL_USER`.
spring.mail.username=${MAIL_USER}

# Password o "App Password" dell'account email, letta dalla variabile d'ambiente `MAIL_PASS`.
spring.mail.password=${MAIL_PASS}

# Imposta l'host SMTP di Gmail per l'invio delle email.
spring.mail.host=smtp.gmail.com

# Imposta la porta standard per connessioni TLS/STARTTLS su Gmail.
spring.mail.port=587

# Abilita l'uso del protocollo STARTTLS per criptare la connessione SMTP.
spring.mail.properties.mail.smtp.starttls.enable=true

# Impone l'uso obbligatorio di STARTTLS per la connessione.
spring.mail.properties.mail.smtp.starttls.required=true

# Abilita l'autenticazione obbligatoria per il server SMTP.
spring.mail.properties.mail.smtp.auth=true

# --- Configurazione Thymeleaf (Motore di Template) ---
# Disabilita la verifica della presenza di cartelle di template.
# Utile se l'app usa solo API REST e non genera viste HTML lato server, evitando errori di avvio.
spring.thymeleaf.check-template-location=false

# --- Configurazione Link Frontend (React) ---
# Imposta l'URL di base per il link di reset della password, letto dalla variabile d'ambiente `PASSWORD_RESET_LINK`.
password.reset.link=${PASSWORD_RESET_LINK}

# Imposta l'URL di base per il link di accesso (login), letto dalla variabile d'ambiente `LOGIN_LINK`.
login.link=${LOGIN_LINK}